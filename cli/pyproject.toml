[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf-cli"
version = "0.1.0"
description = "CLI for AWF workflow and analysis contracts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
sdk = [
  "anthropic>=0.52.0",
  "openai>=1.75.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
awf = "awf.cli:cli_entry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
  "live: tests that call real provider CLI/API (skip by default)",
]
